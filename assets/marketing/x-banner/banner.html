<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{--fondo:#faf7f0;--texto:#1b1814;--texto-2:#4f493f;--texto-3:#8a8276;--linea:rgba(27,24,20,.13);--dgt:#d23a3a}
  body.dark{--fondo:#1a1714;--texto:#f3efe6;--texto-2:#c4bdb1;--texto-3:#8f887d;--linea:rgba(243,239,230,.13);--dgt:#f0605f}
  *{box-sizing:border-box;margin:0}
  body{width:1500px;height:500px;overflow:hidden;background:var(--fondo);color:var(--texto);font-family:"Newsreader",Georgia,serif;-webkit-font-smoothing:antialiased;position:relative}
  svg.fondo{position:absolute;inset:0}
  .bloque{position:absolute;left:112px;top:84px;width:900px}
  .ceja{font-size:21px;letter-spacing:.14em;text-transform:uppercase;color:var(--texto-3);display:flex;align-items:center;gap:14px}
  .ceja i{width:34px;height:1.5px;background:var(--dgt);display:block}
  h1{font-weight:500;font-size:96px;line-height:.98;letter-spacing:-.025em;margin-top:22px}
  h1 em{font-style:normal;color:var(--dgt)}
  .sub{font-size:30px;line-height:1.35;color:var(--texto-2);margin-top:22px;white-space:nowrap}
  .sub b{font-weight:600;color:var(--texto)}
  .url{position:absolute;right:72px;bottom:44px;font-size:22px;color:var(--texto-2);letter-spacing:.01em}
  .url span{color:var(--dgt)}
  .grano{position:absolute;inset:0;opacity:.07;mix-blend-mode:multiply;pointer-events:none}
  body.dark .grano{mix-blend-mode:screen;opacity:.05}
</style></head>
<body class="__TEMA__">
<svg class="fondo" viewBox="0 0 1500 500">
  <defs>
    <radialGradient id="halo"><stop offset="0%" stop-color="var(--dgt)" stop-opacity=".38"/><stop offset="100%" stop-color="var(--dgt)" stop-opacity="0"/></radialGradient>
  </defs>
  <g fill="none" stroke="var(--linea)" stroke-width="1.5">
    <circle cx="1210" cy="215" r="70"/><circle cx="1210" cy="215" r="130"/><circle cx="1210" cy="215" r="195"/><circle cx="1210" cy="215" r="262"/><circle cx="1210" cy="215" r="330"/>
  </g>
  <circle cx="1210" cy="215" r="165" fill="url(#halo)"/>
  <path d="M760 520 C 900 470, 980 380, 1060 330 S 1160 250, 1210 215 S 1330 110, 1420 95 S 1500 60, 1540 40" fill="none" stroke="var(--texto-3)" stroke-width="2" stroke-dasharray="4 9"/>
  <g fill="var(--dgt)">
    <circle cx="1060" cy="330" r="6" opacity=".55"/><circle cx="1335" cy="122" r="8" opacity=".75"/><circle cx="1440" cy="88" r="4.5" opacity=".45"/>
  </g>
  <circle cx="1210" cy="215" r="34" fill="var(--dgt)"/>
</svg>
<svg class="grano" width="1500" height="500"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>
<div class="bloque">
  <div class="ceja"><i></i>Marketing con datos reales</div>
  <h1>Compramos con el <em>estómago.</em></h1>
  <p class="sub">Tus clientes también. Te lo demuestro con <b>169 respuestas reales</b>.</p>
</div>
<div class="url">marketing.alvaropastor.dev <span>→</span></div>
</body></html>
